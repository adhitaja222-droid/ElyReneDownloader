name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ElyReneDownloader.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElyReneDownloader-APK
          path: app/build/outputs/apk/release/ElyReneDownloader.apk

      - name: Clean old split assets if present
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset v2.0.5 app-arm64-v8a-release.apk -y || true
          gh release delete-asset v2.0.5 app-armeabi-v7a-release.apk -y || true

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.7
          name: ElyReneDownloader v2.0.7
          body: |
            Perubahan Update :
            QoL :
            1. Kualitas Edit Video ditingkatkan ke 20 Mbps (resolusi & FPS asli 100% utuh)
            2. Status WA (HD) kini mengirim file resolusi asli tanpa downscale/kompresi ulang agar siap pakai fitur HD Chat Sendiri -> Teruskan ke Status!
          files: app/build/outputs/apk/release/ElyReneDownloader.apk
          overwrite: true
