name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElyReneDownloader-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4
          name: ElyReneDownloader v2.0.4
          body: |
            Perubahan Update :
            QoL :
            1. Tingkatkan kualitas simpan Edit Video ke 15 Mbps agar tajam mendekati asli
            2. Status WA (HD) kini zero-reencode untuk file <=14.5 MB dan smart-cap <=13.8 MB agar tidak dikompres pecah oleh WhatsApp Android
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
