name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Release APK (Split ABI)
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElyReneDownloader-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.5
          name: ElyReneDownloader v2.0.5
          body: |
            Perubahan Update :
            QoL :
            1. Split APK per arsitektur CPU (arm64-v8a / armeabi-v7a) + Release minify agar ukuran download update jauh lebih kecil (~50% lebih ringan!)
            2. Otomatis hapus file installer APK bekas update setelah aplikasi dibuka agar memori HP tidak penuh
          files: app/build/outputs/apk/release/*.apk
          overwrite: true
